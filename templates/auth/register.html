{% extends "base.html" %}

{% block content %}
<h1>Register</h1>

<form method="post" class="mt-3" style="max-width: 500px;">
    <div class="mb-3">
        <label class="form-label">Username</label>
        <input name="username" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Email</label>
        <input name="email" type="email" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Password</label>
        <input name="password" type="password" class="form-control" required minlength="8">
    </div>

    <div class="mb-3">
        <label class="form-label">Confirm password</label>
        <input name="confirm_password" type="password" class="form-control" required minlength="8">
    </div>

    <button class="btn btn-primary">Create account</button>
</form>
{% endblock %}
