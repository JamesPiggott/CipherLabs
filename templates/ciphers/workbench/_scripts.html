<script>
document.addEventListener("DOMContentLoaded", function () {
    const phaseButtons = document.querySelectorAll(".workbench-phase-link");
    const phasePanels = document.querySelectorAll(".workbench-phase-panel");
    const widgetButtons = document.querySelectorAll(".workbench-widget-toggle");

    phaseButtons.forEach((button) => {
        button.addEventListener("click", function () {
            const targetPhase = this.getAttribute("data-phase-target");

            phaseButtons.forEach((item) => item.classList.remove("active"));
            this.classList.add("active");

            phasePanels.forEach((panel) => {
                if (panel.getAttribute("data-phase-panel") === targetPhase) {
                    panel.classList.remove("d-none");
                } else {
                    panel.classList.add("d-none");
                }
            });
        });
    });

    widgetButtons.forEach((button) => {
        button.addEventListener("click", function () {
            const targetWidget = this.getAttribute("data-widget-target");
            const widget = document.querySelector(
                '.workbench-widget[data-widget="' + targetWidget + '"]'
            );

            if (!widget) {
                return;
            }

            widget.classList.toggle("d-none");

            if (widget.classList.contains("d-none")) {
                this.classList.remove("btn-success");
                this.classList.add("btn-outline-secondary");
                this.setAttribute("aria-pressed", "false");
            } else {
                this.classList.add("btn-success");
                this.classList.remove("btn-outline-secondary");
                this.setAttribute("aria-pressed", "true");
            }
        });
    });
});
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const ciphertext = {{ cipher.ciphertext | tojson }};
    const saveUrl = "{{ url_for('ciphers.save_workspace', cipher_id=cipher.id) }}";

    const inputs = document.querySelectorAll(".substitution-input");
    const preview = document.getElementById("substitution-preview");
    const clearButton = document.getElementById("clear-substitution-map");
    const saveButton = document.getElementById("save-workspace");
    const saveNotesOnlyButton = document.getElementById("save-notes-only");
    const notesField = document.getElementById("workspace-notes");

    const workspaceAlertBox = document.getElementById("workspace-save-alert");
    const workspaceUnsavedAlertBox = document.getElementById("workspace-unsaved-alert");
    const notesAlertBox = document.getElementById("workspace-notes-alert");

    let pendingMapping = null;

    function buildMapping() {
        const mapping = {};

        inputs.forEach((input) => {
            const cipherLetter = input.getAttribute("data-cipher-letter");
            const plainLetter = input.value.trim().toUpperCase();

            if (plainLetter.match(/^[A-Z]$/)) {
                mapping[cipherLetter] = plainLetter;
            }
        });

        return mapping;
    }

    function updatePreview() {
        if (!preview) {
            return;
        }

        const mapping = buildMapping();
        let result = "";

        for (let i = 0; i < ciphertext.length; i++) {
            const originalChar = ciphertext[i];
            const upperChar = originalChar.toUpperCase();

            if (mapping[upperChar]) {
                result += mapping[upperChar];
            } else if (upperChar.match(/^[A-Z]$/)) {
                result += "_";
            } else {
                result += originalChar;
            }
        }

        preview.textContent = result;
    }

    function getNotesValue() {
        if (!notesField) {
            return "";
        }

        return notesField.value;
    }

    function showAlert(alertBox, message, type) {
        if (!alertBox) {
            return;
        }

        alertBox.className = "alert alert-" + type;
        alertBox.textContent = message;

        setTimeout(() => {
            alertBox.className = "alert d-none";
            alertBox.textContent = "";
        }, 2500);
    }

    function showUnsavedWorkspaceNotice() {
        if (!workspaceUnsavedAlertBox) {
            return;
        }

        workspaceUnsavedAlertBox.classList.remove("d-none");
    }

    function hideUnsavedWorkspaceNotice() {
        if (!workspaceUnsavedAlertBox) {
            return;
        }

        workspaceUnsavedAlertBox.classList.add("d-none");
    }

    function saveWorkspace(successMessage, alertBox) {
        fetch(saveUrl, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                substitution_mapping: buildMapping(),
                notes: getNotesValue(),
            }),
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                showAlert(alertBox, successMessage, "success");
                hideUnsavedWorkspaceNotice();
            } else {
                showAlert(alertBox, "Could not save workspace.", "danger");
            }
        })
        .catch(() => {
            showAlert(alertBox, "Could not save workspace.", "danger");
        });
    }

    function getExistingPlainLetter(cipherLetter) {
        const input = document.querySelector(
            '.substitution-input[data-cipher-letter="' + cipherLetter + '"]'
        );

        if (!input) {
            return "";
        }

        return input.value.trim().toUpperCase();
    }

    function getCipherLetterUsingPlainLetter(plainLetter, exceptCipherLetter) {
        let existingCipherLetter = "";

        inputs.forEach((input) => {
            const cipherLetter = input.getAttribute("data-cipher-letter");
            const currentPlainLetter = input.value.trim().toUpperCase();

            if (
                currentPlainLetter === plainLetter
                && cipherLetter !== exceptCipherLetter
            ) {
                existingCipherLetter = cipherLetter;
            }
        });

        return existingCipherLetter;
    }

    function detectMappingConflicts(mapping) {
        const conflicts = [];

        Object.keys(mapping).forEach((cipherLetter) => {
            const plainLetter = String(mapping[cipherLetter]).trim().toUpperCase();

            if (!plainLetter.match(/^[A-Z]$/)) {
                return;
            }

            const existingPlainLetter = getExistingPlainLetter(cipherLetter);

            if (
                existingPlainLetter
                && existingPlainLetter !== plainLetter
            ) {
                conflicts.push(
                    cipherLetter + " is already mapped to " + existingPlainLetter +
                    ", but this suggestion maps it to " + plainLetter + "."
                );
            }

            const existingCipherLetter = getCipherLetterUsingPlainLetter(
                plainLetter,
                cipherLetter
            );

            if (existingCipherLetter) {
                conflicts.push(
                    plainLetter + " is already used by " + existingCipherLetter +
                    ", but this suggestion also maps " + cipherLetter +
                    " to " + plainLetter + "."
                );
            }
        });

        return conflicts;
    }

    function setMappingLetterWithoutConflictCheck(cipherLetter, plainLetter) {
        const input = document.querySelector(
            '.substitution-input[data-cipher-letter="' + cipherLetter + '"]'
        );

        if (!input) {
            return;
        }

        input.value = String(plainLetter).trim().toUpperCase();

        input.dispatchEvent(new Event("change", { bubbles: true }));
        input.dispatchEvent(new Event("keyup", { bubbles: true }));
    }

    function applyMapping(mapping) {
        Object.keys(mapping).forEach((cipherLetter) => {
            setMappingLetterWithoutConflictCheck(
                cipherLetter,
                mapping[cipherLetter]
            );
        });

        updatePreview();
        showUnsavedWorkspaceNotice();
    }

    function showMappingConflictModal(conflicts, mapping) {
        const modalElement = document.getElementById("mappingConflictModal");
        const messageElement = document.getElementById("mapping-conflict-message");

        if (!modalElement || !messageElement || !window.bootstrap) {
            applyMapping(mapping);
            return;
        }

        pendingMapping = mapping;
        messageElement.innerHTML = "";

        const list = document.createElement("ul");
        list.className = "mb-0";

        conflicts.forEach((conflict) => {
            const item = document.createElement("li");
            item.textContent = conflict;
            list.appendChild(item);
        });

        messageElement.appendChild(list);

        const modal = bootstrap.Modal.getOrCreateInstance(modalElement);
        modal.show();
    }

    function applyMappingWithConflictCheck(mapping) {
        const conflicts = detectMappingConflicts(mapping);

        if (conflicts.length > 0) {
            showMappingConflictModal(conflicts, mapping);
            return;
        }

        applyMapping(mapping);
    }

    function setMappingLetter(cipherLetter, plainLetter) {
        const mapping = {};
        mapping[cipherLetter] = plainLetter;

        applyMappingWithConflictCheck(mapping);
    }

    inputs.forEach((input) => {
        input.addEventListener("keyup", function () {
            this.value = this.value.toUpperCase().replace(/[^A-Z]/g, "");
            updatePreview();
            showUnsavedWorkspaceNotice();
        });

        input.addEventListener("change", function () {
            updatePreview();
            showUnsavedWorkspaceNotice();
        });
    });

    if (clearButton) {
        clearButton.addEventListener("click", function () {
            inputs.forEach((input) => input.value = "");
            updatePreview();
            showUnsavedWorkspaceNotice();
        });
    }

    if (saveButton) {
        saveButton.addEventListener("click", function () {
            saveWorkspace("Workspace saved.", workspaceAlertBox);
        });
    }

    if (saveNotesOnlyButton) {
        saveNotesOnlyButton.addEventListener("click", function () {
            saveWorkspace("Notes saved.", notesAlertBox);
        });
    }

    document.querySelectorAll(".apply-single-suggestion").forEach((button) => {
        button.addEventListener("click", function () {
            const cipherLetter = this.getAttribute("data-cipher-letter");
            const plainLetter = this.getAttribute("data-plain-letter");

            setMappingLetter(cipherLetter, plainLetter);
        });
    });

    document.querySelectorAll(".apply-ranked-candidate").forEach((button) => {
        button.addEventListener("click", function () {
            const rawMapping = this.getAttribute("data-candidate-mapping");

            if (!rawMapping) {
                return;
            }

            const mapping = JSON.parse(rawMapping);

            applyMappingWithConflictCheck(mapping);
        });
    });

    const confirmConflictButton = document.getElementById("confirm-conflicting-mapping");

    if (confirmConflictButton) {
        confirmConflictButton.addEventListener("click", function () {
            if (!pendingMapping) {
                return;
            }

            applyMapping(pendingMapping);
            pendingMapping = null;

            const modalElement = document.getElementById("mappingConflictModal");

            if (modalElement && window.bootstrap) {
                const modal = bootstrap.Modal.getOrCreateInstance(modalElement);
                modal.hide();
            }
        });
    }

    updatePreview();
});
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const applyButton = document.getElementById("apply-substitution-key");

    if (!applyButton) {
        return;
    }

    const keyInput = document.getElementById("substitution-key");
    const modeInput = document.getElementById("substitution-key-mode");
    const outputBox = document.getElementById("substitution-key-output");
    const alertBox = document.getElementById("substitution-key-alert");

    const applyUrl = "{{ url_for('ciphers.apply_substitution_key', cipher_id=cipher.id) }}";

    function showKeyAlert(message, type) {
        if (!alertBox) {
            return;
        }

        alertBox.className = "alert alert-" + type;
        alertBox.textContent = message;

        setTimeout(() => {
            alertBox.className = "alert d-none";
            alertBox.textContent = "";
        }, 3000);
    }

    keyInput.addEventListener("input", function () {
        this.value = this.value.toUpperCase().replace(/[^A-Z]/g, "");
    });

    applyButton.addEventListener("click", function () {
        fetch(applyUrl, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                key: keyInput.value,
                mode: modeInput.value,
            }),
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                outputBox.textContent = data.output;
                showKeyAlert("Key applied successfully.", "success");
            } else {
                outputBox.textContent = "";
                showKeyAlert(data.message || "Could not apply key.", "danger");
            }
        })
        .catch(() => {
            outputBox.textContent = "";
            showKeyAlert("Could not apply key.", "danger");
        });
    });
});
</script>
