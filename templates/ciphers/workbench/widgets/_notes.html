<div class="card mb-4">
    <div class="card-header">
        Workspace Notes
    </div>

    <div class="card-body">
        <p class="text-muted">
            Record assumptions, partial keys, rejected guesses, and observations while solving this cipher.
        </p>

        {% if not current_user.is_authenticated %}
            <div class="alert alert-warning mb-0">
                Log in to save workspace notes.
            </div>
        {% else %}
            <div id="workspace-notes-alert" class="alert d-none"></div>

            <div class="mb-3">
                <label class="form-label">Notes</label>
                <textarea id="workspace-notes"
                          class="form-control"
                          rows="10"
                          placeholder="Example: A may map to E. Repeated word XQX could be DID, EVE, or TOT.">{{ workspace.notes if workspace else '' }}</textarea>
            </div>

            <button type="button"
                    class="btn btn-primary btn-sm"
                    id="save-notes-only">
                Save Notes
            </button>
        {% endif %}
    </div>
</div>
